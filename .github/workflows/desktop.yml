# Builds the Forja desktop installers (Windows, macOS, Linux). The installers
# are attached to each run as artifacts; a pushed tag like v0.1.0 also
# publishes them on a GitHub release.
name: Desktop app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/*.exe
          - os: macos-latest
            target: --mac
            files: release/*.dmg
          - os: ubuntu-latest
            target: --linux
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile on purpose: one written on Linux omits the native bindings
      # (rolldown, etc.) that macOS and Windows need (npm/cli#4828).
      - run: npm install --no-audit --no-fund
      - run: npm test
      # The stem-separation model ships inside the installer (offline use).
      - run: node scripts/fetch-model.mjs
      # The owner's full build first (Windows only): Produção completa, Voz DNA
      # and Bloopers behind the passphrase. Kept as a run artifact, never put
      # on the public release.
      - if: runner.os == 'Windows'
        run: npm run build:desktop
      - if: runner.os == 'Windows'
        shell: bash
        run: npx electron-builder --win --publish never '-c.win.artifactName=Forja-Completo-Setup.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Forja-Windows-completo
          path: release/Forja-Completo-Setup.exe
          if-no-files-found: error
      - if: runner.os == 'Windows'
        shell: bash
        run: rm -rf release dist
      # The public build: the installer linked from the artist's website. The
      # owner-only tools are not in it at all.
      - run: npm run build:desktop:public
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds: no certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      # A tag publishes the public installers on a release. Their names carry
      # no version, so .../releases/latest/download/Forja-Setup.exe always
      # points at the newest one (that is the link on the website).
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}

  # The AI stem separation with the real model (downloaded here; it is not in
  # the repository): a synthetic song's parts must land in their own stems.
  separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/fetch-model.mjs
      - run: node scripts/check-separation.mjs
